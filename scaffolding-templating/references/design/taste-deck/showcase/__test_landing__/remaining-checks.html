<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: Fraunces, serif; }
  .track { border-radius: 9999px; background: #e5e7eb; width: 100%; }
  .fill { width: 60%; background: #8b4513; }
</style>
</head>
<body>
<section class="hero"><h1>Premium Craft</h1></section>
<section class="py-8"><span class="uppercase tracking-widest">ONE</span></section>
<section class="py-8"><span class="uppercase tracking-wider">TWO</span></section>
<section class="py-8"><span class="uppercase tracking-wide">THREE</span></section>
<section class="py-8"><span class="uppercase tracking-tight">FOUR</span></section>

<section class="py-8" style="color:#d4c5a9; background:#c4a882; border-color:#8b4513">
  <p>Crafted with premium materials.</p>
</section>

<section class="py-8">
  <div class="track"><div class="fill"></div></div>
</section>

<section class="py-8">
  <img src="https://picsum.photos/seed/craft/800/600" alt="Craft">
</section>

<section class="py-8">
  <svg><path d="M0,0 L10,10"/></svg><svg><path d="M0,0 L20,10"/></svg>
  <svg><path d="M0,0 L30,10"/></svg><svg><path d="M0,0 L40,10"/></svg>
  <svg><path d="M0,0 L50,10"/></svg><svg><path d="M0,0 L60,10"/></svg>
</section>

<footer><span>Crafted with Fraunces. Lucide icons.</span></footer>
</body>
</html>
