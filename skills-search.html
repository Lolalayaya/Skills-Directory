<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills 觸發速查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Palette: "Luxury/Premium Brand" (warm stone neutrals + single bronze/gold accent),
     via ui-ux-pro-max --domain color. Deliberately one accent hue throughout (incl. <mark>)
     rather than a second competing color — restraint reads as more considered/premium. */
  :root{
    --bg:#faf9f7;
    --surface:#ffffff;
    --surface-hover:#fbfaf8;
    --border:#e7e3de;
    --text:#1c1917;
    --text-muted:#78716c;
    --text-faint:#a8a29e;
    --accent:#a16207;
    --accent-text:#854d0e;
    --accent-soft:#faf0d7;
    --mark-bg:#f5e2b8;
    --mark-text:#5c3d05;
    --chip-bg:#f0ede8;
    --chip-active-bg:#a16207;
    --chip-active-text:#ffffff;
    --shadow:0 1px 2px rgba(28,25,23,0.06), 0 1px 1px rgba(28,25,23,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17130f;
      --surface:#221d18;
      --surface-hover:#2a2420;
      --border:#3f3630;
      --text:#faf8f6;
      --text-muted:#a8a29e;
      --text-faint:#78716c;
      --accent:#eab308;
      --accent-text:#fcd34d;
      --accent-soft:rgba(234,179,8,0.14);
      --mark-bg:#4a3712;
      --mark-text:#f5e2b8;
      --chip-bg:#2a2420;
      --chip-active-bg:#eab308;
      --chip-active-text:#17130f;
      --shadow:0 1px 2px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
  }
  .icon{
    display:inline-flex;
    flex-shrink:0;
    vertical-align:-3px;
  }

  .page{
    max-width:840px;
    margin:0 auto;
    padding:28px 20px 64px;
  }

  header.top{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    padding:8px 0 14px;
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .subtitle{
    color:var(--text-muted);
    font-size:13.5px;
    margin:0 0 16px;
  }

  .search-wrap{
    position:relative;
    margin-bottom:12px;
  }
  .search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-faint);
    pointer-events:none;
  }
  #q{
    width:100%;
    font-size:16px;
    padding:12px 40px 12px 40px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #q:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  #clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:var(--text-faint);
    cursor:pointer;
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    display:none;
  }
  #clear-btn:hover{ background:var(--chip-bg); color:var(--text); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-family:inherit;
    padding:6px 12px;
    border-radius:999px;
    background:var(--chip-bg);
    color:var(--text-muted);
    border:none;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  .chip:hover{ background:var(--accent-soft); color:var(--text); }
  .chip.active{ background:var(--chip-active-bg); color:var(--chip-active-text); }

  .meta-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    color:var(--text-faint);
    font-size:12.5px;
    padding-top:2px;
  }
  .meta-row span.count b{ color:var(--text-muted); font-weight:600; }

  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .cat-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    font-weight:500;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .skills{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:flex-end;
  }
  .skill-badge{
    font-size:12px;
    padding:3px 9px;
    border-radius:6px;
    background:var(--accent-soft);
    color:var(--accent-text);
    font-weight:600;
    white-space:nowrap;
  }
  .universal-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
    background:var(--mark-bg);
    color:var(--mark-text);
    font-weight:700;
    white-space:nowrap;
  }
  .phrase{
    font-size:15px;
    color:var(--text);
    margin:0 0 6px;
  }
  .desc{
    font-size:13px;
    color:var(--text-muted);
    margin:0;
  }
  mark{
    background:var(--mark-bg);
    color:var(--mark-text);
    border-radius:3px;
    padding:0 1px;
  }

  .empty{
    text-align:center;
    color:var(--text-faint);
    padding:56px 20px;
    font-size:14px;
  }

  footer{
    margin-top:28px;
    padding-top:14px;
    border-top:1px solid var(--border);
    color:var(--text-faint);
    font-size:12px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }

  @media (max-width: 480px){
    .card-top{ flex-direction:column; align-items:flex-start; }
    .skills{ justify-content:flex-start; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Skills 觸發速查</h1>
    <p class="subtitle">打幾個字，秒找對應的 skill —— 來源：<code class="mono">TRIGGER-MAP.md</code> 快照</p>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">

    <div class="chips" id="chips"></div>
    <div class="meta-row">

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">沒有符合的結果——換個關鍵字，或直接問我「我要做 XX，該用哪個 skill」。</div>

  <footer>
    <span>資料來源 <code class="mono">TRIGGER-MAP.md</code>（靜態快照，非即時同步）</span>
    <span>找不到你要的觸發詞？回報給我，我可以直接改對應技能的 description。</span>
  </footer>
</div>

const catInfo = Object.fromEntries(CATS.map(c => [c.key, c]));
let activeCat = null;

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function highlight(text, tokens){
  let escaped = escapeHtml(text);
  if(!tokens.length) return escaped;
  tokens.forEach(t => {
    if(!t) return;
    const escapedTok = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    escaped = escaped.replace(new RegExp('('+escapedTok+')', 'gi'), '<mark>$1</mark>');
  });
  return escaped;
}

function buildChips(){
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = '';
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeCat === c.key ? ' active' : '');
    btn.innerHTML = iconSvg(c.key, 13) + ' <span>' + c.label + '</span>';
    btn.onclick = () => { activeCat = (activeCat === c.key) ? null : c.key; render(); };
    chipsEl.appendChild(btn);
  });
}

function render(){
  buildChips();
  const q = document.getElementById('q').value.trim();
  const tokens = q.split(/\s+/).filter(Boolean);
  document.getElementById('clear-btn').style.display = q ? 'block' : 'none';

  const searchable = e => (e.phrase + ' ' + e.skills.join(' ') + ' ' + e.desc + ' ' + catInfo[e.cat].label).toLowerCase();

  let results = DATA.filter(e => {
    if(activeCat && e.cat !== activeCat) return false;
    if(!tokens.length) return true;
    const hay = searchable(e);
    return tokens.every(t => hay.includes(t.toLowerCase()));
  });

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const filterEl = document.getElementById('active-filter');

  countEl.innerHTML = '符合 <b>' + results.length + '</b> / ' + DATA.length + ' 條';
  filterEl.textContent = activeCat ? ('篩選中：' + catInfo[activeCat].icon + ' ' + catInfo[activeCat].label) : '';

  if(!results.length){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = results.map(e => {
    const info = catInfo[e.cat];
    const skillBadges = e.skills.map(s => '<span class="skill-badge mono">' + highlight(s, tokens) + '</span>').join('');
    const universalBadge = e.universal ? '<span class="universal-badge">' + iconSvg('repeat', 11) + ' 必用</span>' : '';
    return '<div class="card">' +
      '<div class="card-top">' +
        '<span class="cat-tag">' + iconSvg(e.cat, 13) + ' ' + info.label + '</span>' +
        '<div class="skills">' + universalBadge + skillBadges + '</div>' +
      '</div>' +
      '<p class="phrase">' + highlight(e.phrase, tokens) + '</p>' +
      '<p class="desc">' + highlight(e.desc, tokens) + '</p>' +
    '</div>';
  }).join('');
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('q').value = '';
  render();
});

render();
</script>
